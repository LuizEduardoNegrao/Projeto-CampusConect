services:
  postgres:
    image: postgres:18
    container_name: campusconnect-postgres

    restart: unless-stopped

   environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - campusconnect_postgres_data:/var/lib/postgresql

volumes:
  campusconnect_postgres_data: